<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .col { font-family: 'Courier New', monospace; font-size: 13px; fill: #00ff41; opacity: 0; }
      .col-dim { fill: #003b12; }
      .col-bright { fill: #00ff41; }
      .title { font-family: 'Courier New', monospace; font-size: 42px; font-weight: bold; fill: #00d2ff; letter-spacing: 4px; }
      .title-glow { font-family: 'Courier New', monospace; font-size: 42px; font-weight: bold; fill: none; stroke: #00d2ff; stroke-width: 0.5; opacity: 0.4; letter-spacing: 4px; }
      .cursor { fill: #00d2ff; }
      .sub { font-family: 'Courier New', monospace; font-size: 12px; fill: #00ff41; letter-spacing: 2px; }

      @keyframes drop1 { 0%{opacity:0;transform:translateY(-160px)} 10%{opacity:0.9} 80%{opacity:0.6} 100%{opacity:0;transform:translateY(160px)} }
      @keyframes drop2 { 0%{opacity:0;transform:translateY(-160px)} 10%{opacity:0.7} 80%{opacity:0.4} 100%{opacity:0;transform:translateY(160px)} }
      @keyframes drop3 { 0%{opacity:0;transform:translateY(-160px)} 15%{opacity:0.5} 80%{opacity:0.2} 100%{opacity:0;transform:translateY(160px)} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes fadein { 0%{opacity:0} 40%{opacity:0} 70%{opacity:1} 100%{opacity:1} }
      @keyframes glitch1 { 0%,90%,100%{transform:translate(0,0)} 92%{transform:translate(-2px,1px)} 94%{transform:translate(2px,-1px)} 96%{transform:translate(0,0)} }
      @keyframes glitch2 { 0%,85%,100%{opacity:0.4} 87%{opacity:0.8;transform:translate(3px,0)} 89%{opacity:0.4;transform:translate(-3px,0)} 91%{opacity:0.4;transform:translate(0,0)} }
      @keyframes subfade { 0%{opacity:0} 60%{opacity:0} 90%{opacity:0.8} 100%{opacity:0.8} }

      .d1{animation:drop1 2.1s linear infinite}
      .d2{animation:drop2 2.6s linear infinite}
      .d3{animation:drop3 3.2s linear infinite}
      .title-main{animation:glitch1 6s ease-in-out infinite, fadein 2s ease forwards}
      .title-shadow{animation:glitch2 6s ease-in-out infinite, fadein 2s ease forwards}
      .cur{animation:blink 1s step-end infinite}
      .sub-text{animation:subfade 3s ease forwards}
    </style>
  </defs>

  <rect width="900" height="160" class="bg"/>

  <!-- Matrix columns: x positions spread across width -->
  <!-- Col 1 -->
  <text x="18" y="0" class="col d1" style="animation-delay:0s">1<tspan x="18" dy="14">0</tspan><tspan x="18" dy="14">1</tspan><tspan x="18" dy="14">A</tspan><tspan x="18" dy="14">F</tspan><tspan x="18" dy="14">3</tspan><tspan x="18" dy="14">9</tspan><tspan x="18" dy="14" class="col-bright">█</tspan><tspan x="18" dy="14">7</tspan><tspan x="18" dy="14">2</tspan></text>
  <!-- Col 2 -->
  <text x="36" y="0" class="col d2" style="animation-delay:0.4s">ア<tspan x="36" dy="14">0</tspan><tspan x="36" dy="14">ウ</tspan><tspan x="36" dy="14">E</tspan><tspan x="36" dy="14">エ</tspan><tspan x="36" dy="14">B</tspan><tspan x="36" dy="14" class="col-bright">█</tspan><tspan x="36" dy="14">6</tspan><tspan x="36" dy="14">カ</tspan></text>
  <!-- Col 3 -->
  <text x="54" y="0" class="col d1" style="animation-delay:0.9s">D<tspan x="54" dy="14">2</tspan><tspan x="54" dy="14">F</tspan><tspan x="54" dy="14">イ</tspan><tspan x="54" dy="14">8</tspan><tspan x="54" dy="14" class="col-bright">█</tspan><tspan x="54" dy="14">C</tspan><tspan x="54" dy="14">0</tspan><tspan x="54" dy="14">A</tspan></text>
  <!-- Col 4 -->
  <text x="72" y="0" class="col d3" style="animation-delay:0.2s">4<tspan x="72" dy="14">ウ</tspan><tspan x="72" dy="14">9</tspan><tspan x="72" dy="14">1</tspan><tspan x="72" dy="14" class="col-bright">█</tspan><tspan x="72" dy="14">オ</tspan><tspan x="72" dy="14">7</tspan><tspan x="72" dy="14">3</tspan><tspan x="72" dy="14">B</tspan></text>
  <!-- Col 5 -->
  <text x="90" y="0" class="col d2" style="animation-delay:1.3s">E<tspan x="90" dy="14">5</tspan><tspan x="90" dy="14" class="col-bright">█</tspan><tspan x="90" dy="14">ア</tspan><tspan x="90" dy="14">2</tspan><tspan x="90" dy="14">カ</tspan><tspan x="90" dy="14">F</tspan><tspan x="90" dy="14">8</tspan><tspan x="90" dy="14">1</tspan></text>
  <!-- Col 6 -->
  <text x="108" y="0" class="col d1" style="animation-delay:0.7s">イ<tspan x="108" dy="14">A</tspan><tspan x="108" dy="14">3</tspan><tspan x="108" dy="14" class="col-bright">█</tspan><tspan x="108" dy="14">6</tspan><tspan x="108" dy="14">ウ</tspan><tspan x="108" dy="14">0</tspan><tspan x="108" dy="14">D</tspan><tspan x="108" dy="14">エ</tspan></text>
  <!-- Col 7 -->
  <text x="126" y="0" class="col d3" style="animation-delay:1.8s">7<tspan x="126" dy="14" class="col-bright">█</tspan><tspan x="126" dy="14">B</tspan><tspan x="126" dy="14">4</tspan><tspan x="126" dy="14">ア</tspan><tspan x="126" dy="14">9</tspan><tspan x="126" dy="14">2</tspan><tspan x="126" dy="14">オ</tspan><tspan x="126" dy="14">5</tspan></text>
  <!-- Col 8 -->
  <text x="144" y="0" class="col d2" style="animation-delay:0.5s">C<tspan x="144" dy="14">イ</tspan><tspan x="144" dy="14">1</tspan><tspan x="144" dy="14">8</tspan><tspan x="144" dy="14" class="col-bright">█</tspan><tspan x="144" dy="14">E</tspan><tspan x="144" dy="14">カ</tspan><tspan x="144" dy="14">3</tspan><tspan x="144" dy="14">A</tspan></text>

  <!-- Right side columns -->
  <text x="756" y="0" class="col d2" style="animation-delay:0.3s">9<tspan x="756" dy="14">ア</tspan><tspan x="756" dy="14">4</tspan><tspan x="756" dy="14" class="col-bright">█</tspan><tspan x="756" dy="14">B</tspan><tspan x="756" dy="14">7</tspan><tspan x="756" dy="14">エ</tspan><tspan x="756" dy="14">2</tspan><tspan x="756" dy="14">F</tspan></text>
  <text x="774" y="0" class="col d1" style="animation-delay:1.1s">イ<tspan x="774" dy="14">5</tspan><tspan x="774" dy="14">0</tspan><tspan x="774" dy="14">C</tspan><tspan x="774" dy="14" class="col-bright">█</tspan><tspan x="774" dy="14">ウ</tspan><tspan x="774" dy="14">8</tspan><tspan x="774" dy="14">1</tspan><tspan x="774" dy="14">A</tspan></text>
  <text x="792" y="0" class="col d3" style="animation-delay:0.6s">3<tspan x="792" dy="14">E</tspan><tspan x="792" dy="14" class="col-bright">█</tspan><tspan x="792" dy="14">オ</tspan><tspan x="792" dy="14">6</tspan><tspan x="792" dy="14">カ</tspan><tspan x="792" dy="14">9</tspan><tspan x="792" dy="14">D</tspan><tspan x="792" dy="14">4</tspan></text>
  <text x="810" y="0" class="col d2" style="animation-delay:2.0s">ア<tspan x="810" dy="14" class="col-bright">█</tspan><tspan x="810" dy="14">7</tspan><tspan x="810" dy="14">2</tspan><tspan x="810" dy="14">イ</tspan><tspan x="810" dy="14">B</tspan><tspan x="810" dy="14">0</tspan><tspan x="810" dy="14">5</tspan><tspan x="810" dy="14">E</tspan></text>
  <text x="828" y="0" class="col d1" style="animation-delay:1.5s">F<tspan x="828" dy="14">ウ</tspan><tspan x="828" dy="14">3</tspan><tspan x="828" dy="14" class="col-bright">█</tspan><tspan x="828" dy="14">8</tspan><tspan x="828" dy="14">1</tspan><tspan x="828" dy="14">オ</tspan><tspan x="828" dy="14">C</tspan><tspan x="828" dy="14">6</tspan></text>
  <text x="846" y="0" class="col d3" style="animation-delay:0.8s">4<tspan x="846" dy="14">A</tspan><tspan x="846" dy="14">エ</tspan><tspan x="846" dy="14">9</tspan><tspan x="846" dy="14" class="col-bright">█</tspan><tspan x="846" dy="14">2</tspan><tspan x="846" dy="14">カ</tspan><tspan x="846" dy="14">7</tspan><tspan x="846" dy="14">D</tspan></text>
  <text x="864" y="0" class="col d2" style="animation-delay:1.6s">イ<tspan x="864" dy="14">0</tspan><tspan x="864" dy="14" class="col-bright">█</tspan><tspan x="864" dy="14">5</tspan><tspan x="864" dy="14">B</tspan><tspan x="864" dy="14">ア</tspan><tspan x="864" dy="14">3</tspan><tspan x="864" dy="14">8</tspan><tspan x="864" dy="14">E</tspan></text>
  <text x="882" y="0" class="col d1" style="animation-delay:0.1s">6<tspan x="882" dy="14">ウ</tspan><tspan x="882" dy="14">1</tspan><tspan x="882" dy="14">F</tspan><tspan x="882" dy="14">オ</tspan><tspan x="882" dy="14" class="col-bright">█</tspan><tspan x="882" dy="14">4</tspan><tspan x="882" dy="14">9</tspan><tspan x="882" dy="14">C</tspan></text>

  <!-- Glitch shadow title -->
  <text x="450" y="98" text-anchor="middle" class="title-shadow title">0xIta3hi</text>
  <!-- Main title -->
  <text x="450" y="98" text-anchor="middle" class="title-main title">0xIta3hi</text>

  <!-- Blinking cursor -->
  <rect x="680" y="72" width="3" height="36" class="cur cursor"/>

  <!-- Subtitle -->
  <text x="450" y="128" text-anchor="middle" class="sub sub-text">[ cybersecurity · ctf · ai security · binary exploitation ]</text>
</svg>
